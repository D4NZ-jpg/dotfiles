[package]
name = "workspace-bar"
version = "0.45.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
ansi_term = { version = "=0.12.1", default-features = false }
unicode-width = { version = "=0.2.2", default-features = false }
zellij-tile = "=0.45.1"
zellij-tile-utils = "=0.45.1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
panic = "abort"
