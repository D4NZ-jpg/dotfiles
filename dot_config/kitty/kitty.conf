
# Gruvbox dark
include charcoal.conf

background_opacity            0.9

font_family                   JetBrainsMono NFM
italic_font                   auto
bold_font                     auto
bold_italic_font              auto

font_size                     12.0

cursor_shape                  beam 
cursor_stop_blinking_after    20.0

scrollback_lines              2000

select_by_word_characters     :@-./_~?&=%+#

mouse_hide_wait               5.0
enabled_layouts               *

open_url_modifiers            ctrl+shift

window_border_width 0
window_margin_width 5

tab_bar_style powerline

# Clipboard
map super+v             paste_from_clipboard
map ctrl+shift+s        paste_from_selection
map super+c             copy_to_clipboard

# Scrolling
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+k         scroll_line_up
map ctrl+shift+j         scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end
map ctrl+shift+h         show_scrollback

# Window management
map super+n             new_os_window
map super+w             close_window
# tmux owns windows, panes and tabs; kitty's own ones are unmapped so a slip
# of Ctrl+Shift never opens a kitty split beside the tmux ones.
map ctrl+shift+enter    no_op
map ctrl+shift+t        no_op
map ctrl+shift+q        no_op
map ctrl+shift+]        no_op
map ctrl+shift+[        no_op
map ctrl+shift+l        no_op
map ctrl+shift+n        no_op
map ctrl+shift+w        no_op
# tmux never asks kitty for the extended keyboard protocol, so Shift+Enter and
# Ctrl+Enter would arrive as plain Enter and pi submits instead of adding a
# line. Send the CSI u sequences directly; tmux passes them through.
map shift+enter         send_text all \x1b[13;2u
map ctrl+enter          send_text all \x1b[13;5u

# Tab management

# Every kitty window lands in a tmux workspace (see ~/.config/tmux).
shell tmux-attach
