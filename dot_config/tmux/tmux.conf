# tmux workspace setup: one session per project, fixed positions, a note per
# window shown in the status line, and a colour change when an agent stops
# producing output (it is waiting for you). Helpers live in ~/.config/tmux/bin.

# ---- core ------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys"
# Pass modified keys (Shift+Enter, Ctrl+Enter) through to apps such as pi.
set -g extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 10
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g allow-passthrough on          # OSC notifications from pi-notify
set -g set-clipboard on

# Positions never move on their own.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows off
set -g detach-on-destroy off          # closing a session switches to another

# ---- attention: silence means "waiting for you" -----------------------------
# Applied per window by bin/tmux-agent (agent windows only, not shells).
set -g silence-action any
set -g visual-silence off
set -g visual-activity off
set -g visual-bell off
set -g bell-action any
set-hook -g alert-silence 'run-shell -b "~/.config/tmux/bin/tmux-attention \"#{hook_session_name}\" \"#{hook_window_index}\" \"#{hook_window_name}\""'
set-hook -g alert-bell    'run-shell -b "~/.config/tmux/bin/tmux-attention \"#{hook_session_name}\" \"#{hook_window_index}\" \"#{hook_window_name}\""'
set-hook -g after-select-window 'run-shell -b "~/.config/tmux/bin/tmux-attention --seen \"#{session_name}\" \"#{window_index}\""'

# ---- palette ----------------------------------------------------------------
# bg 262626  ink d5c8ac  muted afa286  border 49453d  hover 39362f  warn d9b090
set -g status-style "bg=#262626,fg=#afa286"
set -g message-style "bg=#39362f,fg=#d5c8ac"
set -g message-command-style "bg=#39362f,fg=#d5c8ac"
set -g mode-style "bg=#afa286,fg=#262626"
set -g pane-border-style "fg=#49453d"
set -g pane-active-border-style "fg=#afa286"
set -g popup-border-style "fg=#49453d"
set -g popup-border-lines rounded
set -g display-time 2000

# ---- status line ------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
# left: group/session
set -g status-left "#[fg=#d5c8ac,bold] #{session_name} #[fg=#49453d]│ "
# windows: index:name plus the note (@note, set by you; else @auto-note, set
# by the pi extension from the session title), and a marker when the window
# is waiting for you (silence/bell flag).
set -g window-status-separator ""
set -g window-status-format "#[fg=#afa286] #I:#W#{?@note,#[fg=#827c70] · #{@note},#{?@auto-note,#[fg=#827c70] · #{@auto-note},}}#{?#{==:#{@pi-state},asking},#[fg=#d9b090] ?,#{?#{==:#{@pi-state},error},#[fg=#d9b090] !,#{?#{==:#{@pi-state},done},#[fg=#d9b090] ●,#{?#{==:#{@pi-state},working},#[fg=#827c70] …,#{?#{||:#{window_silence_flag},#{window_bell_flag}},#[fg=#d9b090] ●,}}}}} "
set -g window-status-current-format "#[bg=#39362f,fg=#d5c8ac,bold] #I:#W#{?@note,#[nobold#,fg=#afa286] · #{@note},#{?@auto-note,#[nobold#,fg=#afa286] · #{@auto-note},}}#{?#{==:#{@pi-state},asking},#[fg=#d9b090] ?,#{?#{==:#{@pi-state},error},#[fg=#d9b090] !,#{?#{==:#{@pi-state},done},#[fg=#d9b090] ●,#{?#{==:#{@pi-state},working},#[fg=#827c70] …,#{?#{||:#{window_silence_flag},#{window_bell_flag}},#[fg=#d9b090] ●,}}}}} "
# Silence uses the activity style in tmux.
set -g window-status-activity-style "fg=#d9b090,noreverse"
set -g window-status-bell-style "fg=#d9b090,noreverse"
# right: sessions that need attention, then clock
# the persist save at the end prints nothing; it snapshots the layout every tick
set -g status-right "#(~/.config/tmux/bin/tmux-fleet --status)#[fg=#49453d]│#[fg=#afa286] %H:%M #(~/.config/tmux/bin/tmux-persist save)"

# fzf keys for the pickers below: vim-style movement, charcoal colours.
set-environment -g FZF_DEFAULT_OPTS "--bind=ctrl-j:down,ctrl-k:up,ctrl-d:half-page-down,ctrl-u:half-page-up,ctrl-n:down,ctrl-p:up --color=bg:#262626,bg+:#39362f,fg:#afa286,fg+:#d5c8ac,hl:#d9b090,hl+:#d9b090,prompt:#afa286,pointer:#d5c8ac,marker:#d9b090,header:#827c70,border:#49453d,info:#827c70,spinner:#afa286"

# ---- keys -------------------------------------------------------------------
# Navigation stays on home row and never reorders anything.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Tab last-window
bind -n M-` switch-client -l
# next/previous window: n is taken by notes, so use vim-style h/l
bind l next-window
bind h previous-window
unbind n
unbind p

bind s display-popup -E -w 60% -h 60% -T " open workspaces " "~/.config/tmux/bin/tmux-pick"
bind o display-popup -E -w 70% -h 70% -T " open a project " "~/.config/tmux/bin/tmux-open"
bind w choose-tree -Zs -F "#{?window_active,#[fg=#d5c8ac],#[fg=#afa286]}#{window_name}#{?@note, · #{@note},#{?@auto-note, · #{@auto-note},}}#{?window_silence_flag, ●,}"
bind n command-prompt -I "#{@note}" -p "note:" "set -w @note '%%'"
bind N set -w @note ""
bind a run-shell "~/.config/tmux/bin/tmux-agent #{session_name} #{window_index}"
bind A run-shell "~/.config/tmux/bin/tmux-agent --off #{session_name} #{window_index}"
bind g display-popup -E -w 80% -h 80% -T " attention " "~/.config/tmux/bin/tmux-attention --list"
bind G display-popup -E -w 90% -h 85% -T " pi sessions " "~/.config/tmux/bin/tmux-fleet"

bind c new-window -c "#{pane_current_path}"
bind C display-popup -E -w 70% -h 70% -T " new window in… " "~/.config/tmux/bin/tmux-open --window"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind , command-prompt -I "#W" -p "name:" "rename-window '%%'"
bind M display-popup -E -w 60% -h 60% -T " move window to " "~/.config/tmux/bin/tmux-move"
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
bind x confirm-before -p "kill pane? (y/n)" kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind d detach-client
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
setw -g mode-keys vi
