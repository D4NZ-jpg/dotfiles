# Cold boot: the java/node probes can take seconds before the binaries are
# cached; a short timeout prints a warning on the first prompt.
command_timeout = 10000
# Directory scan (package files, .git) can exceed the 30 ms default on a
# cold cache; the prompt waits at most this long before giving up quietly.
scan_timeout = 200
add_newline = true
format = "[╭╴](fg:arrow)$username$os$git_branch$directory$fill$cmd_duration $time( via $python$conda$nodejs$c$rust$java)\n[╰─](fg:arrow)$character"
palette = "normal"

[c]
disabled = false
format = "[$symbol($version(-$name)) ]($style)"
style = "fg:clang"
symbol = " "
version_format = "$raw"

[character]
error_symbol = "[󰍟](fg:#c98a7a)"
success_symbol = "[󰍟](fg:arrow)"

[cmd_duration]
disabled = false
format = "took [$duration]($style) "
min_time = 500
style = "fg:duration"

[conda]
disabled = false
format = "[$symbol$environment ]($style)"
ignore_base = false
style = "fg:conda"
symbol = " "

[directory]
before_repo_root_style = "fg:directory"
format = "at [$path](bold $style)[$read_only]($read_only_style) "
read_only = "  "
read_only_style = "fg:directory"
style = "fg:directory"
truncate_to_repo = true
truncation_length = 2
truncation_symbol = "…/"

[docker_context]
disabled = false
symbol = " "

[fill]
symbol = ""

[git_branch]
format = "via [$symbol$branch]($style) "
style = "bold fg:git"
symbol = " "

[git_status]
disabled = true
format = "[$all_status$ahead_behind ]($style)"
style = "fg:text_color bg:git"

[java]
# JVM startup is the slowest probe and the version rarely matters in the prompt.
disabled = true
format = "[$symbol$version ]($style)"
style = "fg:java"
symbol = " "
version_format = "$raw"

[nodejs]
disabled = false
format = "[$symbol$version ]($style)"
style = "fg:node"
symbol = " "
version_format = "$raw"

[os]
disabled = true
format = "on [($name)]($style) "
style = "bold blue"

[os.symbols]
Alpine = " "
Arch = " "
Debian = " "
EndeavourOS = " "
Fedora = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = " "
NixOS = " "
Pop = " "
SUSE = " "
Ubuntu = " "
Windows = " "
openSUSE = " "

[package]
disabled = false

# Charcoal: the desktop palette. Frame and time in muted grey, name and
# directory in cream, git in the accent, language versions in the kitty
# ANSI tones so they stay readable without shouting.
[palettes.normal]
arrow = "#827c70"
clang = "#a6b8c0"
conda = "#b7c090"
directory = "#a6b8c0"
duration = "#d9a091"
git = "#d9b090"
git_status = "#afa286"
java = "#d9a091"
node = "#b7c090"
os = "#d5c8ac"
os_admin = "#d9a091"
python = "#e6c6a4"
rust = "#d9a091"
text_color = "#d5c8ac"
text_light = "#262626"
time = "#827c70"

[python]
disabled = false
format = "[$symbol$pyenv_prefix($version)( \\($virtualenv\\)) ]($style)"
style = "fg:python"
symbol = " "
version_format = "$raw"

[rust]
disabled = false
format = "[$symbol$version ]($style)"
style = "fg:rust"
symbol = "󱘗 "
version_format = "$raw"

[time]
disabled = false
format = "[$time]($style) "
style = "fg:time"
time_format = "%H:%M"

[username]
disabled = false
format = "[$user](fg:$style) "
show_always = true
style_root = "bold os_admin"
style_user = "bold os"
